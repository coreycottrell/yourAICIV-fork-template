{% extends "admin/base.html" %}
{% block title %}{{ 'Edit' if post else 'New' }} Blog Post{% endblock %}
{% block admin_content %}
<div class="page-header">
    <h1>{{ 'Edit' if post else 'New' }} Blog Post</h1>
</div>

<form method="POST" class="card" style="padding: 1.5rem; max-width: 800px;">
    <div class="form-group">
        <label for="title">Title</label>
        <input type="text" id="title" name="title" value="{{ post.title if post else '' }}" required>
    </div>

    <div class="form-group">
        <label for="slug">URL Slug</label>
        <input type="text" id="slug" name="slug" value="{{ post.slug if post else '' }}" required
               placeholder="e.g. my-first-post">
    </div>

    <div class="form-group">
        <label for="excerpt">Excerpt</label>
        <textarea id="excerpt" name="excerpt" rows="3" placeholder="Brief summary for listings">{{ post.excerpt if post else '' }}</textarea>
    </div>

    <div class="form-group">
        <label for="author">Author</label>
        <input type="text" id="author" name="author" value="{{ post.author if post else '' }}" placeholder="Author name">
    </div>

    <div class="form-group">
        <label for="content">Content (HTML)</label>
        <textarea id="content" name="content" rows="20" required>{{ post.content if post else '' }}</textarea>
    </div>

    <div class="form-group">
        <label><input type="checkbox" name="published" {{ 'checked' if post and post.published }}> Published</label>
    </div>

    <div style="margin-top: 1rem;">
        <button type="submit" class="btn btn-primary">{{ 'Update' if post else 'Create' }}</button>
        <a href="{{ url_for('blog.admin_blog_list') }}" class="btn btn-secondary">Cancel</a>
    </div>
</form>
{% endblock %}
