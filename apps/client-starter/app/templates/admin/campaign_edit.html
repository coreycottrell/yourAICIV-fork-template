{% extends "admin/base.html" %}
{% block title %}{{ 'Edit' if campaign else 'New' }} Campaign{% endblock %}
{% block admin_content %}
<div class="page-header">
    <h1>{{ 'Edit' if campaign else 'New' }} Campaign</h1>
</div>

<form method="POST" class="card" style="padding: 1.5rem; max-width: 800px;">
    <div class="form-group">
        <label for="subject">Subject Line</label>
        <input type="text" id="subject" name="subject" value="{{ campaign.subject if campaign else '' }}" required
               placeholder="e.g. Your Weekly Update">
    </div>

    <div class="form-group">
        <label for="body">Email Body (HTML)</label>
        <textarea id="body" name="body" rows="20" required
                  placeholder="HTML email body. Use {{first_name}} for personalization.">{{ campaign.body if campaign else '' }}</textarea>
        <small>Supports HTML. Use <code>{{ '{{first_name}}' }}</code> for recipient's first name.</small>
    </div>

    <div style="margin-top: 1rem;">
        <button type="submit" class="btn btn-primary">{{ 'Update' if campaign else 'Create Draft' }}</button>
        <a href="{{ url_for('email_marketing.admin_campaigns') }}" class="btn btn-secondary">Cancel</a>
    </div>
</form>
{% endblock %}
