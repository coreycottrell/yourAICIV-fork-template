{% extends "admin/base.html" %}
{% block title %}Change Password{% endblock %}
{% block admin_content %}

<div class="admin-header">
    <h1>Change Password</h1>
</div>

<form method="POST" class="card" style="max-width: 420px; padding: 1.5rem;">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="form-group">
        <label for="current_password">Current password</label>
        <input type="password" id="current_password" name="current_password" autocomplete="current-password" required>
    </div>
    <div class="form-group">
        <label for="password">New password (12+ characters)</label>
        <input type="password" id="password" name="password" minlength="12" autocomplete="new-password" required>
    </div>
    <div class="form-group">
        <label for="confirm">Confirm new password</label>
        <input type="password" id="confirm" name="confirm" minlength="12" autocomplete="new-password" required>
    </div>
    <button type="submit" class="btn btn-primary">Change Password</button>
    <p style="margin-top: 1rem; font-size: 0.875rem;">Changing the password signs out every other admin session.</p>
</form>
{% endblock %}
